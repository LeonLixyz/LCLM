# Uses the 16k packs built for ratio 16; at lower ratios, expanded memory can
# make sequences longer than 16k.
experiment: 0.6b-4b-cs8-mean-w1024-causal-mlp-O0-sft

models:
  encoder: Qwen/Qwen3-Embedding-0.6B
  decoder: Qwen/Qwen3-4B-Instruct-2507
  pooling: mean
  adapter_type: mlp
  encoder_window_size: 1024
  mask: causal
  decoder_attn_implementation: flash_attention_2
  embed_attn_implementation: flash_attention_2
  boundary_overlap: 0
  use_fused_ce: false

training:
  compression_ratio: 8
  max_encode_batch_size: 1024
  gradient_accumulation_steps: 1
  num_epochs: 1
  warmup_steps: 500
  max_grad_norm: 1.0
  save_steps: 1000
  delete_old_checkpoints: true
  seed: 4231
  auto_resume: true
  preempt_save_minutes: 10
  optimizer: adamw
  scheduler: cosine
  adam_epsilon: 1.0e-8
  decoder_betas: "0.9,0.95"
  encoder_betas: "0.9,0.95"
  adapter_betas: "0.9,0.95"
  decoder_gradient_checkpointing: true
  use_liger_kernel: true

data:
  num_workers: 0
  use_packing: true
  use_memory_wrapping: true
  packed_attention_backend: flash
  train_wrap_tokens: true

logging:
  wandb_project: lclm
  wandb_name: 0.6b-4b-cs8-mean-w1024-causal-mlp-O0-sft
  log_interval: 10
  log_token_counts: true

stages:
  3:
    train_batch_size: 2
    warmup_steps: 500
    train_decoder: true
    train_encoder: true
    adapter_lr: 3.0e-5
    encoder_lr: 3.0e-5
    decoder_lr: 3.0e-5
    min_lr: 1.0e-6
    decoder_weight_decay: 0.0
    encoder_weight_decay: 0.01
    adapter_weight_decay: 0.01
    encoder_gradient_checkpointing: true
    dataset: /path/to/stage3-final-mixture-20260910-packed/packed-cs16-16384
    max_packed_length: 16384
    resume_from_checkpoint: /path/to/stage2-hf  # stage-2 (continual pre-training) checkpoint
    distributed:
      type: deepspeed
      config: scripts/distributed_configs/deepspeed_zero1_multi_node.yaml
